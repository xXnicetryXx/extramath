<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Chat App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; display: flex; height: 100vh; background: #f0f2f5; }
    
    /* Sidebar */
    .sidebar { width: 240px; background: #2f3136; color: white; padding: 15px; display: flex; flex-direction: column; }
    .sidebar h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid #40444b; padding-bottom: 10px; }
    .channels { list-style: none; flex-grow: 1; overflow-y: auto; }
    .channel-item { padding: 10px; cursor: pointer; border-radius: 4px; margin-bottom: 4px; color: #dcddde; }
    .channel-item:hover, .channel-item.active { background: #393c43; color: white; font-weight: bold; }
    .add-channel { display: flex; gap: 5px; margin-top: 10px; }
    .add-channel input { width: 100%; padding: 8px; border-radius: 4px; border: none; background: #40444b; color: white; }
    .add-channel button { padding: 8px 12px; border: none; border-radius: 4px; background: #5865f2; color: white; cursor: pointer; }

    /* Chat Area */
    .chat-area { flex-grow: 1; display: flex; flex-direction: column; background: #ffffff; }
    .chat-header { padding: 15px 20px; border-bottom: 1px solid #e0e0e0; font-weight: bold; font-size: 18px; background: #fafafa; }
    .messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    
    /* Messages */
    .message-card { background: #f4f5f7; padding: 12px; border-radius: 8px; max-width: 75%; align-self: flex-start; border: 1px solid #e5e5e5; }
    .message-header { display: flex; gap: 10px; font-size: 12px; color: #666; margin-bottom: 6px; }
    .message-author { font-weight: bold; color: #202225; }
    .message-text { font-size: 14px; color: #2e3338; word-break: break-word; margin-bottom: 6px; }
    .message-card img { max-width: 100%; max-height: 300px; border-radius: 6px; display: block; margin-top: 6px; }

    /* Input Bar */
    .input-bar { padding: 15px 20px; border-top: 1px solid #e0e0e0; background: #fafafa; }
    .input-form { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 10px; }
    .row input[type="text"] { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
    .row input[type="file"] { padding: 6px; border: 1px solid #ccc; border-radius: 4px; background: white; }
    .input-form button { padding: 10px 20px; border: none; background: #5865f2; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .input-form button:hover { background: #4752c4; }
  </style>

  <!-- Firebase Web SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="sidebar">
    <h2>Channels</h2>
    <ul class="channels" id="channelList"></ul>
    <div class="add-channel">
      <input type="text" id="newChannelInput" placeholder="New channel..." />
      <button id="addChannelBtn">+</button>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header" id="currentChannelHeader"># general</div>
    <div class="messages" id="messageList"></div>

    <div class="input-bar">
      <form id="chatForm" class="input-form">
        <div class="row">
          <input type="text" id="nicknameInput" placeholder="Your Nickname" required />
          <input type="file" id="imageInput" accept="image/*" />
        </div>
        <div class="row">
          <input type="text" id="textInput" placeholder="Type a message..." />
          <button type="submit">Send</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAJ7j2ZNdNVDjwWs0iUawWo8rDJ5p1fxZo",
      authDomain: "fart-89152.firebaseapp.com",
      databaseURL: "https://fart-89152-default-rtdb.firebaseio.com",
      projectId: "fart-89152",
      storageBucket: "fart-89152.firebasestorage.app",
      messagingSenderId: "304051169112",
      appId: "1:304051169112:web:4a284f1915fc017433672d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentChannel = 'general';
    let defaultChannels = ['general', 'random'];

    const channelList = document.getElementById('channelList');
    const messageList = document.getElementById('messageList');
    const currentChannelHeader = document.getElementById('currentChannelHeader');
    const chatForm = document.getElementById('chatForm');

    function fileToBase64(file) {
      return new Promise((resolve) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
      });
    }

    db.ref('channels').on('value', (snapshot) => {
      const dbChannels = snapshot.val() || {};
      const allChannels = Array.from(new Set([...defaultChannels, ...Object.values(dbChannels)]));

      channelList.innerHTML = allChannels.map(ch => `
        <li class="channel-item ${ch === currentChannel ? 'active' : ''}" onclick="switchChannel('${ch}')">
          # ${ch}
        </li>
      `).join('');

      currentChannelHeader.textContent = `# ${currentChannel}`;
    });

    function switchChannel(channel) {
      currentChannel = channel;
      db.ref('channels').once('value');
      listenForMessages();
    }

    document.getElementById('addChannelBtn').addEventListener('click', () => {
      const input = document.getElementById('newChannelInput');
      const name = input.value.trim().toLowerCase().replace(/\s+/g, '-');
      if (name) {
        db.ref('channels').push(name);
        input.value = '';
        switchChannel(name);
      }
    });

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nickname = document.getElementById('nicknameInput').value;
      const text = document.getElementById('textInput').value;
      const fileInput = document.getElementById('imageInput');
      const imageBase64 = await fileToBase64(fileInput.files[0]);

      if (!text && !imageBase64) return;

      db.ref(`messages/${currentChannel}`).push({
        nickname: nickname,
        text: text,
        image: imageBase64,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      document.getElementById('textInput').value = '';
      fileInput.value = '';
    });

    function listenForMessages() {
      db.ref(`messages/${currentChannel}`).on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const messages = Object.values(data);

        messageList.innerHTML = messages.map(msg => `
          <div class="message-card">
            <div class="message-header">
              <span class="message-author">${msg.nickname}</span>
              <span>${msg.timestamp}</span>
            </div>
            ${msg.text ? `<div class="message-text">${msg.text}</div>` : ''}
            ${msg.image ? `<img src="${msg.image}" />` : ''}
          </div>
        `).join('');

        messageList.scrollTop = messageList.scrollHeight;
      });
    }

    listenForMessages();
  </script>
</body>
</html>
